AdjustExplanation = <ul><li>Vous pouvez ajuster votre date et heure d'arrivée en cliquant sur le repère d'arrivée (premier triangle violet) et le déplacer sur la date et heure d'arrivée que vous souhaitez (veuillez maintenir le bouton de la souris enfoncé pendant le déplacement).</li><li>Vous pouvez ajuster de la même manière votre date et heure de départ avec le repère de départ (second triangle violet).<span ng-if='Event.currentEvent.passControl'> Veuillez noter cependant que pendant le Festival vous ne pouvez sélectionner un départ en milieu de journée. A votre arrivée, vous obtiendrez en effet un badge qui restera valide jusqu'à la fin de la journée de votre départ (ou fin du Festival). Toutes les séances sont donc automatiquement réservées jusqu'à la date d'expiration de votre badge.</span></li></ul>
